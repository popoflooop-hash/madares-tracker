<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسار — تسجيل الدخول</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>مسار</h1>
<p style="margin-bottom:16px;color:#666">تسجيل الدخول حسب نوع الحساب</p>

<div class="card">
  <input type="email" id="email" placeholder="البريد الإلكتروني">
  <input type="password" id="password" placeholder="كلمة المرور">
  <button onclick="login()">دخول</button>
  <button class="secondary" onclick="window.location.href='register.html'">إنشاء حساب جديد</button>
  <p id="error" style="color:red;margin-top:8px"></p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBNVNqvhQs7i2PZfk2WEW0ON4PdoErk1i4",
  authDomain: "my-school-57688.firebaseapp.com",
  projectId: "my-school-57688",
  storageBucket: "my-school-57688.firebasestorage.app",
  messagingSenderId: "842457078793",
  appId: "1:842457078793:web:7b2045d827feabf1fe6cd8"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

const ADMIN_EMAIL = "popofloop@gmail.com";

async function login() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('error');
  try {
    const cred = await auth.signInWithEmailAndPassword(email, password);

    if (cred.user.email === ADMIN_EMAIL) {
      window.location.href = 'admin.html';
      return;
    }

    const userDoc = await db.collection('users').doc(cred.user.uid).get();
    const role = userDoc.exists ? userDoc.data().role : null;

    if (role === 'school_admin') window.location.href = 'school-dashboard.html';
    else if (role === 'parent') window.location.href = 'parent.html';
    else if (role === 'student') window.location.href = 'student.html';
    else errorEl.textContent = 'الحساب ده مش متسجل بدور معروف (تواصل مع المدرسة)';
  } catch (e) {
    errorEl.textContent = 'خطأ في تسجيل الدخول: ' + e.message;
  }
}
</script>
</body>
</html>
