<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسار — تسجيل الدخول</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>مسار</h1>
<p style="margin-bottom:16px;color:#666">تسجيل الدخول حسب نوع الحساب</p>

<div class="card">
  <input type="email" id="email" placeholder="البريد الإلكتروني">
  <input type="password" id="password" placeholder="كلمة المرور">
  <button onclick="login()">دخول</button>
  <p id="error" style="color:red;margin-top:8px"></p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js" onerror="alert('فشل تحميل: firebase-app')" onload="alert('نجح تحميل: firebase-app')"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js" onerror="alert('فشل تحميل: firebase-auth')" onload="alert('نجح تحميل: firebase-auth')"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js" onerror="alert('فشل تحميل: firebase-firestore')" onload="alert('نجح تحميل: firebase-firestore')"></script>
<script src="firebase-config.js"></script>
<script>
async function login() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('error');
  try {
    const cred = await auth.signInWithEmailAndPassword(email, password);
    const userDoc = await db.collection('users').doc(cred.user.uid).get();
    const role = userDoc.exists ? userDoc.data().role : null;
    if (role === 'parent') window.location.href = 'parent.html';
    else if (role === 'student') window.location.href = 'student.html';
    else errorEl.textContent = 'الحساب ده مش متسجل بدور معروف (تواصل مع المدرسة)';
  } catch (e) {
    errorEl.textContent = 'خطأ في تسجيل الدخول: ' + e.message;
  }
}
</script>
</body>
</html>
