<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسار — لوحة تحكم المدرسة</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>لوحة تحكم المدرسة</h1>
<p style="margin-bottom:16px;color:#666">الإعدادات الأساسية</p>

<div class="card">
  <label style="display:block;margin-bottom:6px;font-weight:bold">اسم المدرسة</label>
  <input type="text" id="schoolName" placeholder="اسم المدرسة">

  <label style="display:block;margin-bottom:6px;font-weight:bold">خط عرض نقطة تسجيل الحضور (lat)</label>
  <input type="text" id="checkInLat" placeholder="مثال: 31.243725">

  <label style="display:block;margin-bottom:6px;font-weight:bold">خط طول نقطة تسجيل الحضور (lng)</label>
  <input type="text" id="checkInLng" placeholder="مثال: 32.325963">

  <label style="display:block;margin-bottom:6px;font-weight:bold">نصف قطر منطقة تسجيل الحضور (متر)</label>
  <input type="number" id="checkInRadius" placeholder="15">

  <label style="display:block;margin-bottom:6px;font-weight:bold">موعد بداية اليوم الدراسي</label>
  <input type="time" id="schoolStartTime">

  <label style="display:block;margin-bottom:6px;font-weight:bold">موعد نهاية اليوم الدراسي</label>
  <input type="time" id="schoolEndTime">

  <label style="display:block;margin-bottom:6px;font-weight:bold">أيام الدراسة</label>
  <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px">
    <label><input type="checkbox" class="workday" value="0"> الأحد</label>
    <label><input type="checkbox" class="workday" value="1"> الإثنين</label>
    <label><input type="checkbox" class="workday" value="2"> الثلاثاء</label>
    <label><input type="checkbox" class="workday" value="3"> الأربعاء</label>
    <label><input type="checkbox" class="workday" value="4"> الخميس</label>
    <label><input type="checkbox" class="workday" value="5"> الجمعة</label>
    <label><input type="checkbox" class="workday" value="6"> السبت</label>
  </div>

  <label style="display:block;margin-bottom:6px;font-weight:bold">إجازات إضافية (تاريخ واحد في كل مرة)</label>
  <input type="date" id="holidayInput">
  <button onclick="addHoliday()">إضافة إجازة</button>
  <div id="holidaysList" style="margin-bottom:14px"></div>

  <button onclick="saveSchoolSettings()">حفظ الإعدادات</button>
  <p id="status" style="margin-top:8px"></p>
</div>

<div class="card">
  <h2>إعلان جديد لأولياء الأمور</h2>
  <input type="text" id="announcementTitle" placeholder="عنوان الإعلان">
  <textarea id="announcementMessage" placeholder="نص الإعلان" style="width:100%;padding:12px;border-radius:8px;border:1px solid #ccc;margin-bottom:10px;min-height:80px"></textarea>
  <button onclick="postAnnouncement()">نشر الإعلان</button>
  <p id="annStatus" style="margin-top:8px"></p>

  <h2 style="margin-top:20px">الإعلانات المنشورة</h2>
  <div id="announcementsList"></div>
</div>

<div class="card">
  <h2>إدارة المواد والمدرسين</h2>

  <label style="display:block;margin-bottom:6px;font-weight:bold">المرحلة الدراسية</label>
  <select id="teacherGrade">
    <option value="primary1">أولى ابتدائي</option>
    <option value="primary2">ثانية ابتدائي</option>
    <option value="primary3">ثالثة ابتدائي</option>
    <option value="primary4">رابعة ابتدائي</option>
    <option value="primary5">خامسة ابتدائي</option>
    <option value="primary6">سادسة ابتدائي</option>
    <option value="prep1">أولى إعدادي</option>
    <option value="prep2">ثانية إعدادي</option>
    <option value="prep3">ثالثة إعدادي</option>
    <option value="secondary1">أولى ثانوي</option>
    <option value="secondary2">ثانية ثانوي</option>
    <option value="secondary3">ثالثة ثانوي</option>
  </select>

  <input type="text" id="subjectName" placeholder="اسم المادة (مثال: رياضيات)">
  <input type="text" id="teacherName" placeholder="اسم المدرس">
  <input type="email" id="teacherEmail" placeholder="البريد الإلكتروني لحساب المدرس">
  <input type="password" id="teacherPassword" placeholder="كلمة مرور حساب المدرس (6 أحرف على الأقل)">
  <button onclick="addTeacher()">إضافة المدرس وإنشاء حسابه</button>
  <p id="teacherStatus" style="margin-top:8px"></p>

  <div id="teachersList" style="margin-top:14px"></div>
</div>

<button class="secondary" onclick="auth.signOut().then(()=>location.href='index.html')">تسجيل خروج</button>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="school-dashboard.js"></script>
</body>
</html>
