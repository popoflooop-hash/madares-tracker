<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسار — لوحة الإدارة العليا</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>لوحة الإدارة العليا</h1>
<p style="margin-bottom:16px;color:#666">إنشاء حساب مدرسة جديد</p>

<div class="card">
  <label style="display:block;margin-bottom:6px;font-weight:bold">البريد الإلكتروني الخاص بالمدرسة</label>
  <input type="email" id="schoolEmail" placeholder="admin@school.com">

  <label style="display:block;margin-bottom:6px;font-weight:bold">كلمة المرور</label>
  <input type="password" id="schoolPassword" placeholder="6 أحرف على الأقل">

  <button onclick="createSchoolAdmin()">إنشاء حساب المدرسة</button>
  <p id="status" style="margin-top:8px"></p>
</div>

<button class="secondary" onclick="auth.signOut().then(()=>location.href='index.html')">تسجيل خروج</button>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="admin.js"></script>
</body>
</html>
